<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Elite Diet Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #000000; --glass: rgba(28, 28, 30, 0.9);
            --border: rgba(255, 255, 255, 0.1); --accent: #0a84ff;
            --text: #ffffff; --success: #30d158; --gray: #8e8e93; --danger: #ff453a;
            --water: #007aff; --warning: #ff9f0a;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; 
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .container { 
            max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px;
        }
        h1 { font-size: 16px; text-align: center; color: var(--accent); letter-spacing: 3px; margin: 15px 0; }
        
        /* Kártya stílus */
        .card { 
            background: var(--glass); border-radius: 20px; padding: 15px; 
            border: 1px solid var(--border); backdrop-filter: blur(20px);
        }
        label { display: block; font-size: 11px; color: var(--gray); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        
        /* Inputok */
        input { 
            width: 100%; background: none; border: none; color: white; 
            font-size: 20px; font-weight: 600; outline: none; padding: 5px 0;
        }
        input::placeholder { color: #444; }

        /* Gombok */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .main-btn { 
            border: none; padding: 18px; border-radius: 15px; 
            font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .main-btn:active { transform: scale(0.96); }
        .quick-btn { background: rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 12px; border: none; font-weight: 600; flex: 1; }

        /* Speciális kijelzők */
        #daily-def-display { font-size: 36px; font-weight: 900; text-align: center; margin: 10px 0; cursor: pointer; }
        .sub-text { font-size: 12px; color: var(--gray); text-align: center; margin-top: -5px; }

        /* Modal / Lista nézet */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; 
            display: none; flex-direction: column; padding: 40px 20px;
        }
        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; border-bottom: 1px solid var(--border); font-size: 18px;
        }
        .del-x { color: var(--danger); font-weight: bold; padding: 10px; }

        /* Statisztika */
        #stat-screen { display: none; }
        .stat-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .check-item { font-size: 10px; display: flex; align-items: center; gap: 5px; }

        /* Navigáció */
        .nav-bar { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
    </style>
</head>
<body>

<div id="app-main" class="container">
    <h1>ELITE TRACKER</h1>
    
    <div class="card">
        <label>Dátum</label>
        <input type="date" id="date" onchange="loadDailyData()">
    </div>

    <div class="btn-grid">
        <div class="card">
            <label>Ébredési súly (kg)</label>
            <input type="number" id="weight" step="0.1" inputmode="decimal" placeholder="0.0" oninput="liveCalc()">
        </div>
        <div class="card" id="waist-card" style="display:none;">
            <label>Derék (cm)</label>
            <input type="number" id="waist" step="0.1" inputmode="decimal" placeholder="0.0">
        </div>
    </div>

    <div class="card">
        <label>Lépésszám (L1: Napközben | L2: Éjfél után)</label>
        <div class="btn-grid">
            <input type="number" id="steps_l1" placeholder="L1" inputmode="numeric" oninput="liveCalc()">
            <input type="number" id="steps_l2" placeholder="L2" inputmode="numeric" oninput="liveCalc()">
        </div>
        <div id="step-display" style="text-align:center; font-weight:800; color:var(--success); margin-top:10px; cursor:pointer;" onclick="showList('steps')">0 Lépés</div>
    </div>

    <div class="card">
        <label>Kalória bevitel (Összesen: <span id="kcal-total">0</span>)</label>
        <input type="number" id="kcal_add" placeholder="+ kcal hozzáadása" inputmode="numeric">
        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="quick-btn" onclick="quickAdd('kcal_add', 100)">+100</button>
            <button class="quick-btn" onclick="quickAdd('kcal_add', 500)">+500</button>
        </div>
    </div>

    <div class="card">
        <label>Vízfogyasztás (Összesen: <span id="water-total">0</span> L)</label>
        <input type="number" id="water_add" step="0.1" placeholder="+ Liter" inputmode="decimal">
        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="quick-btn" style="color:var(--water)" onclick="quickAdd('water_add', 0.3)">+3dl</button>
            <button class="quick-btn" style="color:var(--water)" onclick="quickAdd('water_add', 0.5)">+5dl</button>
        </div>
    </div>

    <div id="daily-def-display" onclick="showList('kcal')">0 kcal</div>
    <div class="sub-text">Napi Deficit (Kattints a listához)</div>

    <div class="nav-bar">
        <button class="main-btn" style="background:var(--success); color:white;" onclick="saveData()">MENTÉS</button>
        <button class="main-btn" style="background:var(--accent); color:white;" onclick="toggleStats(true)">STATISZTIKA</button>
    </div>
</div>

<div id="stat-screen" class="container">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <button onclick="toggleStats(false)" style="background:none; border:none; color:var(--accent); font-size:24px;">✕</button>
        <h1>STATISZTIKA</h1>
        <div style="width:24px;"></div>
    </div>

    <div class="card">
        <div class="stat-controls">
            <div class="check-item"><input type="checkbox" checked onchange="updateChart()" id="ch-weight"> Súly</div>
            <div class="check-item"><input type="checkbox" checked onchange="updateChart()" id="ch-steps"> Lépés</div>
            <div class="check-item"><input type="checkbox" checked onchange="updateChart()" id="ch-def"> Deficit</div>
        </div>
        <canvas id="myChart" style="width:100%; height:300px;"></canvas>
    </div>

    <button class="main-btn" style="background:var(--warning); color:black; width:100%;" onclick="exportCSV()">ADATOK EXPORTÁLÁSA (CSV)</button>
</div>

<div id="list-modal" class="modal">
    <div style="display:flex; justify-content: space-between;">
        <h2 id="modal-title">Lista</h2>
        <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:30px;">✕</button>
    </div>
    <div id="modal-content" style="overflow-y:auto; flex:1;"></div>
</div>

<script>
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    let currentUser = JSON.parse(localStorage.getItem('diet_session')) || {name: "felhasznalo"}; // Teszt név
    let currentDayData = { kcal_list: [], water_list: [], steps_list: [] };
    let chartInstance = null;

    document.getElementById('date').valueAsDate = new Date();

    function toggleStats(show) {
        document.getElementById('app-main').style.display = show ? 'none' : 'flex';
        document.getElementById('stat-screen').style.display = show ? 'flex' : 'none';
        if(show) updateChart();
    }

    function checkWaist() {
        const d = new Date(document.getElementById('date').value);
        document.getElementById('waist-card').style.display = (d.getDay() === 1) ? 'block' : 'none';
    }

    async function loadDailyData() {
        checkWaist();
        const dateStr = document.getElementById('date').value;
        try {
            const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${dateStr}.json`);
            const data = await res.json();
            currentDayData = data || { kcal_list: [], water_list: [], steps_list: [] };
            if(!currentDayData.kcal_list) currentDayData.kcal_list = [];
            if(!currentDayData.water_list) currentDayData.water_list = [];
            
            document.getElementById('weight').value = currentDayData.weight || '';
            document.getElementById('waist').value = currentDayData.waist || '';
            document.getElementById('steps_l1').value = currentDayData.steps_l1 || '';
            document.getElementById('steps_l2').value = currentDayData.steps_l2 || '';
            
            refreshTotals();
            liveCalc();
        } catch(e) { console.error(e); }
    }

    function refreshTotals() {
        const kSum = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        const wSum = currentDayData.water_list.reduce((a,b)=>a+b,0);
        document.getElementById('kcal-total').innerText = kSum;
        document.getElementById('water-total').innerText = wSum.toFixed(1);
    }

    function liveCalc() {
        const w = parseFloat(document.getElementById('weight').value) || 0;
        const s1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const s2 = parseInt(document.getElementById('steps_l2').value) || 0;
        const steps = s1 + s2;
        document.getElementById('step-display').innerText = `${steps.toLocaleString()} Lépés`;

        if(w > 10) {
            const bmr = (10 * w) + (6.25 * 170) - (5 * 41) + 5;
            const burn = steps * (w * 0.00045);
            const cin = currentDayData.kcal_list.reduce((a,b)=>a+b,0) + (parseInt(document.getElementById('kcal_add').value) || 0);
            const def = Math.round((bmr + burn) - cin);
            const disp = document.getElementById('daily-def-display');
            disp.innerText = `${def} kcal`;
            disp.style.color = def > 0 ? 'var(--success)' : 'var(--danger)';
        }
    }

    function quickAdd(id, val) {
        const el = document.getElementById(id);
        el.value = (parseFloat(el.value || 0) + val).toFixed(id === 'water_add' ? 1 : 0);
        liveCalc();
    }

    function showList(type) {
        const modal = document.getElementById('list-modal');
        const content = document.getElementById('modal-content');
        document.getElementById('modal-title').innerText = type === 'kcal' ? 'Bevitt Kalóriák' : 'Víz / Egyéb';
        content.innerHTML = '';
        
        const list = type === 'kcal' ? currentDayData.kcal_list : currentDayData.water_list;
        
        list.forEach((val, index) => {
            content.innerHTML += `
                <div class="list-item">
                    <span>${val} ${type === 'kcal' ? 'kcal' : 'L'}</span>
                    <span class="del-x" onclick="removeItem('${type}', ${index})">TÖRLÉS</span>
                </div>`;
        });
        modal.style.display = 'flex';
    }

    async function removeItem(type, idx) {
        if(type === 'kcal') currentDayData.kcal_list.splice(idx, 1);
        else currentDayData.water_list.splice(idx, 1);
        closeModal();
        refreshTotals();
        liveCalc();
    }

    function closeModal() { document.getElementById('list-modal').style.display = 'none'; }

    async function saveData() {
        const date = document.getElementById('date').value;
        const kA = parseInt(document.getElementById('kcal_add').value) || 0;
        const wA = parseFloat(document.getElementById('water_add').value) || 0;
        
        if(kA > 0) currentDayData.kcal_list.push(kA);
        if(wA > 0) currentDayData.water_list.push(wA);

        const w = parseFloat(document.getElementById('weight').value) || 0;
        const l1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const l2 = parseInt(document.getElementById('steps_l2').value) || 0;
        const cin = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        const bmr = (10 * w) + (6.25 * 170) - (5 * 41) + 5;
        const def = Math.round((bmr + ((l1+l2) * w * 0.00045)) - cin);

        const payload = {
            ...currentDayData, weight: w, waist: parseFloat(document.getElementById('waist').value) || 0,
            steps_l1: l1, steps_l2: l2, steps: l1+l2, kcal_in: cin, deficit: def,
            water: parseFloat(currentDayData.water_list.reduce((a,b)=>a+b,0).toFixed(1))
        };

        await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${date}.json`, { method: 'PATCH', body: JSON.stringify(payload) });
        document.getElementById('kcal_add').value = '';
        document.getElementById('water_add').value = '';
        loadDailyData();
        alert("Mentve!");
    }

    async function updateChart() {
        const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}.json`);
        const data = await res.json();
        const labels = Object.keys(data).sort();
        const weights = labels.map(l => data[l].weight);
        const steps = labels.map(l => data[l].steps);
        const defs = labels.map(l => data[l].deficit);

        if(chartInstance) chartInstance.destroy();
        
        const ctx = document.getElementById('myChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels.map(l => l.split('-').slice(1).join('.')),
                datasets: [
                    { label: 'Súly', data: weights, borderColor: '#0a84ff', yAxisID: 'yW', hidden: !document.getElementById('ch-weight').checked },
                    { label: 'Lépés', data: steps, borderColor: '#30d158', yAxisID: 'yS', hidden: !document.getElementById('ch-steps').checked },
                    { label: 'Deficit', data: defs, borderColor: '#ff9f0a', yAxisID: 'yD', hidden: !document.getElementById('ch-def').checked }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    yW: { type: 'linear', position: 'left', title: {display:true, text:'kg', color:'#0a84ff'} },
                    yS: { type: 'linear', position: 'right', grid:{display:false}, title:{display:true, text:'lépés', color:'#30d158'} },
                    yD: { display: false }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    async function exportCSV() {
        const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}.json`);
        const data = await res.json();
        let csv = "Datum;Suly;Derek;Lepes;Kcal;Deficit;Viz\n";
        Object.keys(data).sort().forEach(d => {
            const o = data[d];
            csv += `${d};${o.weight};${o.waist};${o.steps};${o.kcal_in};${o.deficit};${o.water}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'diet_data.csv';
        a.click();
    }

    loadDailyData();
</script>
</body>
</html>
