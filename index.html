<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Elite Diet Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #000000; --glass: rgba(28, 28, 30, 0.9);
            --border: rgba(255, 255, 255, 0.1); --accent: #0a84ff;
            --text: #ffffff; --success: #30d158; --gray: #8e8e93; --danger: #ff453a;
            --water: #007aff; --warning: #ff9f0a;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; 
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        h1 { font-size: 14px; letter-spacing: 3px; color: var(--accent); margin: 0; font-weight: 900; }
        .card { background: var(--glass); border-radius: 20px; padding: 15px; border: 1px solid var(--border); backdrop-filter: blur(20px); }
        label { display: block; font-size: 10px; color: var(--gray); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        input, select { width: 100%; background: none; border: none; color: white; font-size: 20px; font-weight: 600; outline: none; padding: 5px 0; }
        input::placeholder { color: #444; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .main-btn { border: none; padding: 16px; border-radius: 15px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .quick-btn { background: rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 12px; border: none; font-weight: 600; flex: 1; font-size: 12px; }
        #daily-def-display { font-size: 32px; font-weight: 900; text-align: center; margin-top: 10px; min-height: 40px; }
        .delta-badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.05); margin-left: 5px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; padding: 40px 20px; overflow-y: auto; }
        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 100; }
        .stat-controls { display: flex; gap: 5px; margin-bottom: 12px; }
        .check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .check-item { font-size: 11px; display: flex; align-items: center; gap: 6px; color: var(--gray); }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    </style>
</head>
<body>

<div id="app-main" class="container">
    <div class="header-row">
        <h1>ELITE TRACKER</h1>
        <button onclick="toggleSettings(true)" style="background:none; border:none; font-size:22px; cursor:pointer;">⚙️</button>
    </div>
    
    <div class="card">
        <label>Dátum</label>
        <input type="date" id="date" onchange="loadDailyData()">
    </div>

    <div class="btn-grid">
        <div class="card">
            <label>Súly (kg) <span id="weight-delta" class="delta-badge">--</span></label>
            <input type="number" id="weight" step="0.1" inputmode="decimal" placeholder="0.0" oninput="liveCalc()">
        </div>
        <div class="card">
            <label>Derék (cm)</label>
            <input type="number" id="waist" step="0.1" inputmode="decimal" placeholder="0.0">
        </div>
    </div>

    <div class="card">
        <label>Lépések</label>
        <div class="btn-grid">
            <input type="number" id="steps_l1" placeholder="Napközben" inputmode="numeric" oninput="liveCalc()">
            <input type="number" id="steps_l2" placeholder="Éjfél után" inputmode="numeric" oninput="liveCalc()">
        </div>
        <div id="step-display" style="text-align:center; font-weight:800; color:var(--success); margin-top:8px; font-size:18px;">0 Lépés</div>
    </div>

    <div class="card">
        <label>Kalória (Bevitt: <span id="kcal-total">0</span>)</label>
        <input type="number" id="kcal_add" placeholder="+ kcal" inputmode="numeric" oninput="liveCalc()">
        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="quick-btn" onclick="quickAdd('kcal_add', 100)">+100</button>
            <button class="quick-btn" onclick="quickAdd('kcal_add', 500)">+500</button>
        </div>
    </div>

    <div class="card">
        <label>Víz (Összesen: <span id="water-total">0</span> L)</label>
        <input type="number" id="water_add" step="0.1" placeholder="+ Liter" inputmode="decimal">
        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="quick-btn" style="color:var(--water)" onclick="quickAdd('water_add', 0.3)">+3dl</button>
            <button class="quick-btn" style="color:var(--water)" onclick="quickAdd('water_add', 0.5)">+5dl</button>
        </div>
    </div>

    <div id="daily-def-display" onclick="showList('kcal')">0 kcal</div>
    <div style="text-align:center; font-size:11px; color:var(--gray); margin-top:-5px;">NAPI DEFICIT</div>

    <div class="nav-bar">
        <button class="main-btn" style="background:var(--success); color:white;" onclick="saveData()">MENTÉS</button>
        <button class="main-btn" style="background:var(--accent); color:white;" onclick="toggleStats(true)">STATISZTIKA</button>
    </div>
</div>

<div id="settings-modal" class="modal">
    <h2 style="text-align:center; color:var(--accent);">BEÁLLÍTÁSOK</h2>
    <div class="card">
        <label>Születési dátum</label>
        <input type="date" id="set-dob">
        <label style="margin-top:15px;">Magasság (cm)</label>
        <input type="number" id="set-height">
        <label style="margin-top:15px;">Nem</label>
        <select id="set-gender">
            <option value="male">Férfi</option>
            <option value="female">Nő</option>
        </select>
    </div>
    <div style="margin-top:25px; display:flex; flex-direction:column; gap:12px;">
        <button class="main-btn" style="background:var(--success); color:white;" onclick="saveSettings()">MENTÉS</button>
        <button class="main-btn" style="background:rgba(255,255,255,0.1); color:white;" onclick="toggleSettings(false)">BEZÁRÁS</button>
    </div>
</div>

<div id="stat-screen" class="container" style="display:none;">
    <div class="header-row">
        <button onclick="toggleStats(false)" style="background:none; border:none; color:white; font-size:24px;">←</button>
        <h1>STATISZTIKA</h1>
        <div style="width:24px;"></div>
    </div>
    <div class="card">
        <div class="stat-controls">
            <button class="quick-btn" onclick="updateChart(7)">7 n</button>
            <button class="quick-btn" onclick="updateChart(30)">1 h</button>
            <button class="quick-btn" onclick="updateChart(0)">Mind</button>
        </div>
        <div class="check-grid">
            <div class="check-item"><input type="checkbox" checked id="ch-weight" onchange="updateChart()"> Súly</div>
            <div class="check-item"><input type="checkbox" checked id="ch-trend" onchange="updateChart()"> Trend</div>
            <div class="check-item"><input type="checkbox" id="ch-steps" onchange="updateChart()"> Lépés</div>
            <div class="check-item"><input type="checkbox" id="ch-def" onchange="updateChart()"> Deficit</div>
            <div class="check-item"><input type="checkbox" id="ch-waist" onchange="updateChart()"> Derék</div>
            <div class="check-item"><input type="checkbox" id="ch-water" onchange="updateChart()"> Víz</div>
        </div>
        <canvas id="myChart" style="width:100%; height:320px;"></canvas>
    </div>
</div>

<div id="list-modal" class="modal">
    <div style="display:flex; justify-content: space-between; align-items:center;">
        <h2 id="modal-title" style="margin:0;">LISTA</h2>
        <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:30px;">✕</button>
    </div>
    <div id="modal-content" style="margin-top:20px;"></div>
</div>

<script>
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    const USER_NAME = "felhasznalo"; 
    let currentDayData = { kcal_list: [], water_list: [] };
    let allHistory = {};
    let chartInstance = null;
    let userSettings = JSON.parse(localStorage.getItem('user_settings')) || { dob: '1985-11-16', height: 180, gender: 'male' };

    // Dátum beállítása mai napra
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;

    async function loadDailyData() {
        const dateStr = document.getElementById('date').value;
        try {
            const res = await fetch(`${DB_URL}diet_tracker/${USER_NAME}.json`);
            const data = await res.json();
            allHistory = data || {};
            
            currentDayData = allHistory[dateStr] || { kcal_list: [], water_list: [] };
            if(!currentDayData.kcal_list) currentDayData.kcal_list = [];
            if(!currentDayData.water_list) currentDayData.water_list = [];

            document.getElementById('weight').value = currentDayData.weight || '';
            document.getElementById('waist').value = currentDayData.waist || '';
            document.getElementById('steps_l1').value = currentDayData.steps_l1 || '';
            document.getElementById('steps_l2').value = currentDayData.steps_l2 || '';
            
            calculateWeightDelta(dateStr);
            refreshTotals();
            liveCalc();
        } catch(e) { console.error("Hiba:", e); }
    }

    function calculateWeightDelta(currentDate) {
        const dates = Object.keys(allHistory).sort();
        const idx = dates.indexOf(currentDate);
        const deltaEl = document.getElementById('weight-delta');
        if (idx > 0) {
            const prevWeight = allHistory[dates[idx-1]].weight;
            const currentWeight = currentDayData.weight;
            if (prevWeight && currentWeight) {
                const diff = (currentWeight - prevWeight).toFixed(1);
                deltaEl.innerText = (diff > 0 ? "+" : "") + diff + " kg";
                deltaEl.style.color = diff > 0 ? "var(--danger)" : "var(--success)";
                return;
            }
        }
        deltaEl.innerText = "--";
        deltaEl.style.color = "var(--gray)";
    }

    function liveCalc() {
        const w = parseFloat(document.getElementById('weight').value) || 0;
        const steps = (parseInt(document.getElementById('steps_l1').value) || 0) + (parseInt(document.getElementById('steps_l2').value) || 0);
        document.getElementById('step-display').innerText = `${steps.toLocaleString()} Lépés`;

        if(w > 10) {
            const age = new Date().getFullYear() - new Date(userSettings.dob).getFullYear();
            const s = userSettings.gender === 'male' ? 5 : -161;
            const bmr = (10 * w) + (6.25 * userSettings.height) - (5 * age) + s;
            const burn = steps * (w * 0.00045);
            const cin = (currentDayData.kcal_list.reduce((a,b)=>a+b,0)) + (parseInt(document.getElementById('kcal_add').value) || 0);
            const def = Math.round((bmr + burn) - cin);
            const disp = document.getElementById('daily-def-display');
            disp.innerText = `${def} kcal`;
            disp.style.color = def > 0 ? 'var(--success)' : 'var(--danger)';
        }
    }

    async function saveData() {
        const date = document.getElementById('date').value;
        const kA = parseInt(document.getElementById('kcal_add').value) || 0;
        const wA = parseFloat(document.getElementById('water_add').value) || 0;
        if(kA > 0) currentDayData.kcal_list.push(kA);
        if(wA > 0) currentDayData.water_list.push(wA);

        const w = parseFloat(document.getElementById('weight').value) || 0;
        const l1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const l2 = parseInt(document.getElementById('steps_l2').value) || 0;
        
        const payload = {
            ...currentDayData, weight: w, waist: parseFloat(document.getElementById('waist').value) || 0,
            steps_l1: l1, steps_l2: l2, steps: l1+l2, kcal_in: currentDayData.kcal_list.reduce((a,b)=>a+b,0),
            water: parseFloat(currentDayData.water_list.reduce((a,b)=>a+b,0).toFixed(1))
        };

        await fetch(`${DB_URL}diet_tracker/${USER_NAME}/${date}.json`, { method: 'PATCH', body: JSON.stringify(payload) });
        document.getElementById('kcal_add').value = '';
        document.getElementById('water_add').value = '';
        await loadDailyData();
        alert("Mentve és szinkronizálva!");
    }

    function toggleSettings(show) {
        document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
        if(show) {
            document.getElementById('set-dob').value = userSettings.dob;
            document.getElementById('set-height').value = userSettings.height;
            document.getElementById('set-gender').value = userSettings.gender;
        }
    }

    function saveSettings() {
        userSettings = {
            dob: document.getElementById('set-dob').value,
            height: parseInt(document.getElementById('set-height').value),
            gender: document.getElementById('set-gender').value
        };
        localStorage.setItem('user_settings', JSON.stringify(userSettings));
        toggleSettings(false);
        liveCalc();
    }

    function toggleStats(show) {
        document.getElementById('app-main').style.display = show ? 'none' : 'flex';
        document.getElementById('stat-screen').style.display = show ? 'flex' : 'none';
        if(show) setTimeout(() => updateChart(7), 100);
    }

    async function updateChart(days = 7) {
        const res = await fetch(`${DB_URL}diet_tracker/${USER_NAME}.json`);
        const data = await res.json();
        if(!data) return;
        
        let labels = Object.keys(data).sort();
        if(days > 0) labels = labels.slice(-days);

        const weights = labels.map(l => data[l].weight || null);
        const steps = labels.map(l => data[l].steps || 0);
        const waters = labels.map(l => data[l].water || 0);
        const waists = labels.map(l => data[l].waist || 0);
        const defs = labels.map(l => {
            const w = data[l].weight || 0;
            const s = data[l].steps || 0;
            const c = data[l].kcal_in || 0;
            if(w < 10) return 0;
            const age = new Date().getFullYear() - new Date(userSettings.dob).getFullYear();
            const bmr = (10 * w) + (6.25 * userSettings.height) - (5 * age) + (userSettings.gender === 'male' ? 5 : -161);
            return Math.round((bmr + (s * w * 0.00045)) - c);
        });
        
        const trend = weights.map((_, i) => {
            const slice = weights.slice(Math.max(0, i-6), i+1).filter(v => v !== null);
            return slice.length ? (slice.reduce((a,b) => a+b, 0) / slice.length).toFixed(2) : null;
        });

        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(document.getElementById('myChart'), {
            data: {
                labels: labels.map(l => l.split('-').slice(1).join('.')),
                datasets: [
                    { type: 'line', label: 'Súly', data: weights, borderColor: '#0a84ff', tension: 0.3, yAxisID: 'y', hidden: !document.getElementById('ch-weight').checked },
                    { type: 'line', label: 'Trend', data: trend, borderColor: '#ffffff', borderDash: [5, 5], pointRadius: 0, yAxisID: 'y', hidden: !document.getElementById('ch-trend').checked },
                    { type: 'bar', label: 'Lépés', data: steps, backgroundColor: 'rgba(48, 209, 88, 0.2)', yAxisID: 'yS', hidden: !document.getElementById('ch-steps').checked },
                    { type: 'bar', label: 'Deficit', data: defs, backgroundColor: 'rgba(255, 159, 10, 0.3)', yAxisID: 'yS', hidden: !document.getElementById('ch-def').checked },
                    { type: 'bar', label: 'Derék', data: waists, backgroundColor: '#ff453a', yAxisID: 'yS', hidden: !document.getElementById('ch-waist').checked },
                    { type: 'bar', label: 'Víz', data: waters, backgroundColor: 'rgba(0, 122, 255, 0.3)', yAxisID: 'yS', hidden: !document.getElementById('ch-water').checked }
                ]
            },
            options: {
                scales: { y: { position: 'left' }, yS: { display: false } },
                plugins: { legend: { display: false } }
            }
        });
    }

    function quickAdd(id, v) { 
        const el = document.getElementById(id); 
        el.value = (parseFloat(el.value || 0) + v).toFixed(id.includes('water') ? 1 : 0); 
        liveCalc(); 
    }
    
    function refreshTotals() {
        document.getElementById('kcal-total').innerText = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        document.getElementById('water-total').innerText = (currentDayData.water_list.reduce((a,b)=>a+b,0)).toFixed(1);
    }

    function showList(type) {
        const modal = document.getElementById('list-modal');
        const content = document.getElementById('modal-content');
        content.innerHTML = '';
        if(type === 'kcal') {
            currentDayData.kcal_list.forEach((val, i) => {
                content.innerHTML += `<div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #222;">
                    <span>${val} kcal</span><span style="color:var(--danger);" onclick="removeItem(${i})">TÖRLÉS</span>
                </div>`;
            });
        }
        modal.style.display = 'flex';
    }

    async function removeItem(idx) {
        currentDayData.kcal_list.splice(idx, 1);
        closeModal();
        refreshTotals();
        liveCalc();
    }

    function closeModal() { document.getElementById('list-modal').style.display = 'none'; }
    window.onfocus = loadDailyData;
    loadDailyData();
</script>
</body>
</html>
