<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Fogyókúra Elite Pro Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #000000; --glass: rgba(28, 28, 30, 0.9);
            --border: rgba(255, 255, 255, 0.1); --accent: #0a84ff;
            --text: #ffffff; --success: #30d158; --gray: #8e8e93; --danger: #ff453a;
            --water: #007aff; --trend: #ff9f0a; --warning: #ffd60a;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; overflow-x: hidden; }
        .container { max-width: 500px; margin: auto; background: var(--glass); backdrop-filter: blur(15px); padding: 15px; border-radius: 25px; border: 1px solid var(--border); min-height: 95vh; display: flex; flex-direction: column; }
        
        #missing-data-alert { background: rgba(255, 214, 10, 0.15); color: var(--warning); padding: 12px; border-radius: 12px; margin-bottom: 12px; font-size: 11px; display: none; align-items: center; cursor: pointer; border: 1px solid rgba(255, 214, 10, 0.3); }

        h1 { font-size: 20px; text-align: center; margin: 10px 0; color: var(--accent); letter-spacing: 1.5px; font-weight: 900; }
        .input-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 18px; margin-bottom: 10px; border: 1px solid var(--border); }
        label { display: block; font-size: 10px; color: var(--gray); text-transform: uppercase; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; background: none; border: none; color: white; font-size: 18px; font-weight: 600; outline: none; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .main-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 18px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 5px; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3); }
        
        .list-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; padding: 30px 20px; }
        .list-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border); align-items: center; }
        .del-btn { color: var(--danger); font-weight: bold; padding: 8px; font-size: 12px; }

        .chart-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .chk-label { font-size: 11px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.07); padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
        
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; padding: 15px; overflow-y: auto; }
        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; align-items: center; justify-content: center; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div id="loading-overlay">SZINKRONIZÁLÁS...</div>

<div id="login-screen" class="container" style="justify-content: center;">
    <h1>FOGYÓKÚRA ELITE</h1>
    <div class="input-card"><label>Név</label><input type="text" id="login-user" spellcheck="false"></div>
    <div class="input-card"><label>Jelszó</label><input type="password" id="login-pass"></div>
    <button class="main-btn" onclick="handleLogin()">BELÉPÉS</button>
</div>

<div id="app-content" class="container" style="display:none;">
    <div id="missing-data-alert" onclick="jumpToMissingDay()">⚠️ Hiányzó súlyadat: <span id="missing-dates"></span></div>
    
    <div id="user-display" style="font-size: 9px; color: var(--accent); text-align: center; letter-spacing: 3px; margin-bottom: 5px;"></div>
    <div class="input-card"><label>Dátum</label><input type="date" id="date" onchange="loadDailyData()"></div>
    
    <div class="grid">
        <div class="input-card"><label>Ébredési (kg)</label><input type="number" id="weight" step="0.1" inputmode="decimal" oninput="liveCalc()"></div>
        <div class="input-card"><label>Lefekvési (kg)</label><input type="number" id="weight_evening" step="0.1" inputmode="decimal"></div>
    </div>

    <div class="input-card" id="waist-card" style="display:none; border: 1px solid var(--accent);">
        <label style="color: var(--accent);">Hétfői derékbőség (cm)</label>
        <input type="number" id="waist" step="0.1" inputmode="decimal">
    </div>
    
    <div class="input-card">
        <label>Lépések (L1: Éjfélig | L2: Éjfél után)</label>
        <div class="grid">
            <input type="number" id="steps_l1" placeholder="L1" inputmode="numeric" oninput="liveCalc()">
            <input type="number" id="steps_l2" placeholder="L2" inputmode="numeric" oninput="liveCalc()">
        </div>
        <div id="step-result" style="margin-top: 8px; font-size: 13px; font-weight: 800; color: var(--success);">0 Lépés</div>
    </div>

    <div class="grid">
        <div class="input-card" onclick="showEditList('kcal')" style="cursor:pointer">
            <label>Bevitel (kcal) 🔍</label>
            <div id="kcal-total" style="font-size: 18px; font-weight: 700;">0</div>
            <input type="number" id="kcal_add" placeholder="+ Hozzáad" inputmode="numeric" style="font-size: 14px; margin-top: 5px; color: var(--gray);" oninput="liveCalc()">
        </div>
        <div class="input-card" onclick="showEditList('water')" style="cursor:pointer">
            <label>Víz (L) 🔍</label>
            <div id="water-total" style="font-size: 18px; font-weight: 700;">0</div>
            <input type="number" id="water_add" step="0.1" placeholder="+ Hozzáad" inputmode="decimal" style="font-size: 14px; margin-top: 5px; color: var(--gray);">
        </div>
    </div>

    <div class="input-card" style="text-align: center; background: rgba(48, 209, 88, 0.05);">
        <label>Napi Deficit</label>
        <div id="daily-def-display" style="font-weight: 900; font-size: 26px; color: var(--success);">0 kcal</div>
    </div>

    <button class="main-btn" onclick="saveData()">MENTÉS</button>
    <button class="main-btn" style="background:rgba(255,255,255,0.08); box-shadow: none;" onclick="openCharts()">STATISZTIKA</button>
    <button onclick="logout()" style="background:none; border:none; color:var(--gray); width:100%; font-size:10px; margin-top: 20px; letter-spacing: 1px;">KIJELENTKEZÉS</button>
</div>

<div id="list-overlay" class="list-overlay">
    <h2 id="list-title" style="margin-top:0"></h2>
    <div id="list-content" style="max-height: 70vh; overflow-y: auto; margin-bottom: 20px;"></div>
    <button class="main-btn" onclick="closeList()">BEZÁRÁS</button>
</div>

<div id="chart-modal" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
        <h2 style="margin:0">Haladás</h2>
        <button onclick="closeChart()" style="background:none; border:none; color:white; font-size:35px; line-height: 1;">✕</button>
    </div>
    
    <div class="chart-controls">
        <label class="chk-label"><input type="checkbox" id="chk-weight" checked onchange="updateChart()"> Reggeli Súly</label>
        <label class="chk-label"><input type="checkbox" id="chk-weight-ev" checked onchange="updateChart()"> Esti Súly</label>
        <label class="chk-label"><input type="checkbox" id="chk-steps" onchange="updateChart()"> Lépés</label>
        <label class="chk-label"><input type="checkbox" id="chk-water" onchange="updateChart()"> Víz</label>
        <label class="chk-label"><input type="checkbox" id="chk-def" checked onchange="updateChart()"> Deficit</label>
        <label class="chk-label"><input type="checkbox" id="chk-kcal" onchange="updateChart()"> Kcal Be</label>
    </div>

    <div style="background: rgba(255,255,255,0.03); border-radius: 20px; padding: 10px; border: 1px solid var(--border);">
        <canvas id="mainChart"></canvas>
    </div>
    <div id="summary-box" style="margin-top:15px; padding:18px; background:rgba(10, 132, 255, 0.1); border-radius:20px; border: 1px solid var(--accent);"></div>
    <button class="main-btn" style="background: var(--success); margin-top: 15px;" onclick="exportCSV()">CSV EXPORT</button>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }

    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    let currentUser = JSON.parse(localStorage.getItem('diet_session'));
    let currentDayData = { kcal_list: [], water_list: [] };
    let missingDays = [];

    function showLoading(s) { document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none'; }

    async function handleLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        if(!u || !p) return;
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}shopping_users/${u}.json`);
            let stored = await res.json();
            if (stored && String(stored).replace(/"/g, '') === String(p)) {
                currentUser = { name: u };
                localStorage.setItem('diet_session', JSON.stringify(currentUser));
                initApp();
            } else alert("Hibás jelszó!");
        } catch (e) { alert("Szerver hiba!"); }
        showLoading(false);
    }

    function initApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'flex';
        document.getElementById('user-display').innerText = currentUser.name.toUpperCase();
        checkMissingData();
        loadDailyData();
    }

    async function checkMissingData() {
        const today = new Date();
        missingDays = [];
        for(let i=1; i<=3; i++) {
            let d = new Date(); d.setDate(today.getDate() - i);
            let dStr = d.toISOString().split('T')[0];
            const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${dStr}.json`);
            const data = await res.json();
            if(!data || !data.weight) missingDays.push(dStr);
        }
        const alertBox = document.getElementById('missing-data-alert');
        if(missingDays.length > 0) {
            alertBox.style.display = 'flex';
            document.getElementById('missing-dates').innerText = missingDays.join(', ');
        } else alertBox.style.display = 'none';
    }

    function jumpToMissingDay() {
        document.getElementById('date').value = missingDays[0];
        loadDailyData();
    }

    async function loadDailyData() {
        const dateStr = document.getElementById('date').value;
        const d = new Date(dateStr);
        document.getElementById('waist-card').style.display = (d.getDay() === 1) ? 'block' : 'none';

        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${dateStr}.json`);
            currentDayData = await res.json() || { kcal_list: [], water_list: [] };
            if(!currentDayData.kcal_list) currentDayData.kcal_list = [];
            if(!currentDayData.water_list) currentDayData.water_list = [];

            document.getElementById('weight').value = currentDayData.weight || '';
            document.getElementById('weight_evening').value = currentDayData.weight_evening || '';
            document.getElementById('waist').value = currentDayData.waist || '';
            document.getElementById('steps_l1').value = currentDayData.steps_l1 || '';
            document.getElementById('steps_l2').value = currentDayData.steps_l2 || '';
            
            refreshTotals();
            liveCalc();
        } catch(e) {}
        showLoading(false);
    }

    function refreshTotals() {
        const kSum = currentDayData.kcal_list.reduce((a, b) => a + b, 0);
        const wSum = currentDayData.water_list.reduce((a, b) => a + b, 0);
        document.getElementById('kcal-total').innerText = kSum;
        document.getElementById('water-total').innerText = wSum.toFixed(1);
    }

    async function liveCalc() {
        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const l1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const l2 = parseInt(document.getElementById('steps_l2').value) || 0;
        const dateStr = document.getElementById('date').value;
        
        const d = new Date(dateStr); d.setDate(d.getDate() - 1);
        const resY = await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${d.toISOString().split('T')[0]}.json`);
        const yData = await resY.json();
        const yL2 = yData ? (yData.steps_l2 || 0) : 0;

        const totalSteps = Math.max(0, (l1 + l2) - yL2);
        document.getElementById('step-result').innerText = `${totalSteps.toLocaleString()} Lépés`;

        if(weight > 0) {
            const age = new Date().getFullYear() - 1985;
            const bmr = (10 * weight) + (6.25 * 170) - (5 * age) + 5;
            const burn = totalSteps * (weight * 0.00045);
            const currentTotal = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
            const addNow = parseInt(document.getElementById('kcal_add').value) || 0;
            const def = Math.round((bmr + burn) - (currentTotal + addNow));
            const disp = document.getElementById('daily-def-display');
            disp.innerText = `${def} kcal`;
            disp.style.color = def > 0 ? 'var(--success)' : 'var(--danger)';
        }
    }

    async function saveData() {
        showLoading(true);
        const date = document.getElementById('date').value;
        const kAdd = parseInt(document.getElementById('kcal_add').value) || 0;
        const wAdd = parseFloat(document.getElementById('water_add').value) || 0;

        if(kAdd > 0) currentDayData.kcal_list.push(kAdd);
        if(wAdd > 0) currentDayData.water_list.push(wAdd);

        const weight = parseFloat(document.getElementById('weight').value);
        const l1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const l2 = parseInt(document.getElementById('steps_l2').value) || 0;
        
        const d = new Date(date); d.setDate(d.getDate() - 1);
        const resY = await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${d.toISOString().split('T')[0]}.json`);
        const yData = await resY.json();
        const totalSteps = Math.max(0, (l1 + l2) - (yData?.steps_l2 || 0));

        const cin = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        const bmr = (10 * weight) + (6.25 * 170) - (5 * (new Date().getFullYear()-1985)) + 5;
        const def = Math.round((bmr + (totalSteps * weight * 0.00045)) - cin);

        const up = {
            ...currentDayData,
            date,
            weight,
            weight_evening: parseFloat(document.getElementById('weight_evening').value),
            waist: parseFloat(document.getElementById('waist').value),
            steps_l1: l1, steps_l2: l2, steps: totalSteps,
            kcal_in: cin, deficit: def,
            water: parseFloat(currentDayData.water_list.reduce((a,b)=>a+b,0).toFixed(1))
        };

        await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${date}.json`, { method: 'PATCH', body: JSON.stringify(up) });
        document.getElementById('kcal_add').value = '';
        document.getElementById('water_add').value = '';
        await loadDailyData();
        checkMissingData();
        showLoading(false);
    }

    function showEditList(type) {
        const list = type === 'kcal' ? currentDayData.kcal_list : currentDayData.water_list;
        document.getElementById('list-title').innerText = type === 'kcal' ? 'Kcal tételek' : 'Víz tételek';
        let html = '';
        list.forEach((val, i) => {
            html += `<div class="list-item"><span>${val} ${type==='kcal'?'kcal':'L'}</span><span class="del-btn" onclick="removeItem('${type}', ${i})">TÖRLÉS</span></div>`;
        });
        document.getElementById('list-content').innerHTML = html || '<p style="color:var(--gray)">Nincs rögzített adat mára.</p>';
        document.getElementById('list-overlay').style.display = 'block';
    }

    async function removeItem(type, idx) {
        if(type === 'kcal') currentDayData.kcal_list.splice(idx, 1);
        else currentDayData.water_list.splice(idx, 1);
        await saveData();
        showEditList(type);
    }
    function closeList() { document.getElementById('list-overlay').style.display = 'none'; }

    let myChart = null;
    async function openCharts() {
        document.getElementById('chart-modal').style.display = 'block';
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}.json`);
            const raw = await res.json();
            window.chartFullData = Object.values(raw).sort((a,b) => new Date(a.date) - new Date(b.date));
            updateChart();
        } catch(e) {}
        showLoading(false);
    }

    function updateChart() {
        const data = window.chartFullData.slice(-14);
        const labels = data.map(d => d.date.slice(5));
        const datasets = [];
        
        if(document.getElementById('chk-weight').checked) {
            datasets.push({ label: 'Súly', data: data.map(d => d.weight), borderColor: '#0a84ff', yAxisID: 'y', tension: 0.1, pointRadius: 4 });
            const movingAvg = data.map((d, i, arr) => {
                const slice = arr.slice(Math.max(0, i-4), i+1).filter(x => x.weight > 0);
                return slice.length ? (slice.reduce((a,b)=>a+b.weight,0) / slice.length) : null;
            });
            datasets.push({ label: 'Trend', data: movingAvg, borderColor: '#ff9f0a', borderWidth: 3, pointRadius: 0, tension: 0.4 });
        }
        
        if(document.getElementById('chk-weight-ev').checked) {
            datasets.push({ label: 'Esti', data: data.map(d => d.weight_evening), borderColor: '#5856d6', borderDash: [5,5], yAxisID: 'y', pointRadius: 2 });
        }

        if(document.getElementById('chk-steps').checked) {
            datasets.push({ label: 'Lépés', data: data.map(d => d.steps), backgroundColor: 'rgba(48, 209, 88, 0.1)', type: 'bar', yAxisID: 'y1' });
        }

        if(document.getElementById('chk-water').checked) {
            datasets.push({ label: 'Víz', data: data.map(d => d.water), borderColor: '#007aff', yAxisID: 'y2', tension: 0.3 });
        }

        if(document.getElementById('chk-def').checked) {
            datasets.push({ label: 'Deficit', data: data.map(d => d.deficit), borderColor: '#30d158', yAxisID: 'y1', tension: 0.3 });
        }

        if(document.getElementById('chk-kcal').checked) {
            datasets.push({ label: 'Kcal', data: data.map(d => d.kcal_in), borderColor: '#ff453a', yAxisID: 'y1', tension: 0.3 });
        }

        if(myChart) myChart.destroy();
        myChart = new Chart(document.getElementById('mainChart'), {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { position: 'left', grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8e8e93' } },
                    y1: { position: 'right', display: false },
                    y2: { position: 'right', display: false }
                },
                plugins: { legend: { display: false } }
            }
        });

        const totalDef = data.reduce((a, b) => a + (b.deficit || 0), 0);
        document.getElementById('summary-box').innerHTML = `
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; text-align:center;">
                <div><small style="color:var(--gray)">14 NAPOS DEFICIT</small><br><b style="font-size:18px">${totalDef.toLocaleString()} kcal</b></div>
                <div><small style="color:var(--gray)">VÁRHATÓ FOGYÁS</small><br><b style="font-size:18px">${(totalDef/7700).toFixed(2)} kg</b></div>
            </div>`;
    }

    function exportCSV() {
        let csv = "\uFEFFDátum,Súly,Esti Súly,Lépés,Víz,Kcal_Be,Deficit,Derék\n";
        window.chartFullData.forEach(h => {
            csv += `${h.date},${h.weight || ''},${h.weight_evening || ''},${h.steps || 0},${h.water || 0},${h.kcal_in || 0},${h.deficit || 0},${h.waist || ''}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `diet_export_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
    }

    function closeChart() { document.getElementById('chart-modal').style.display = 'none'; }
    function logout() { localStorage.removeItem('diet_session'); location.reload(); }
    if(currentUser) initApp();
</script>
</body>
</html>
