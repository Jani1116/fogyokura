<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Elite Diet Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #000000; --glass: rgba(28, 28, 30, 0.9);
            --border: rgba(255, 255, 255, 0.1); --accent: #0a84ff;
            --text: #ffffff; --success: #30d158; --gray: #8e8e93; --danger: #ff453a;
            --water: #007aff; --trend: #ff9500; --waist: #bf5af2;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; 
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 100px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        h1 { font-size: 14px; letter-spacing: 3px; color: var(--accent); margin: 0; font-weight: 900; }
        .card { background: var(--glass); border-radius: 20px; padding: 15px; border: 1px solid var(--border); backdrop-filter: blur(20px); }
        label { display: block; font-size: 10px; color: var(--gray); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        input, select { width: 100%; background: none; border: none; color: white; font-size: 20px; font-weight: 600; outline: none; padding: 5px 0; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .main-btn { border: none; padding: 16px; border-radius: 15px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; }
        .quick-btn { background: rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 12px; border: none; font-weight: 600; flex: 1; font-size: 12px; cursor: pointer; }
        #daily-def-display { font-size: 32px; font-weight: 900; text-align: center; margin-top: 10px; min-height: 40px; }
        .delta-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); }
        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 100; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; padding: 20px; }
        .modal-inner { overflow-y: auto; flex: 1; padding-top: 20px; }
        
        .stat-controls { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; font-size: 12px; }
        .check-grid label { display: flex; align-items: center; gap: 8px; text-transform: none; color: white; font-size: 13px; margin-bottom: 0; }
        .check-grid input { width: 18px; height: 18px; }
        .chart-container { height: 320px; position: relative; margin-top: 10px; background: rgba(255,255,255,0.03); border-radius: 15px; padding: 10px; }
    </style>
</head>
<body>

<div id="app-main" class="container">
    <div class="header-row">
        <h1>ELITE TRACKER</h1>
        <button onclick="toggleSettings(true)" style="background:none; border:none; font-size:22px; cursor:pointer;">⚙️</button>
    </div>
    
    <div class="card">
        <label>Dátum</label>
        <input type="date" id="date" onchange="loadDailyData()">
    </div>

    <div class="btn-grid">
        <div class="card">
            <label style="display:flex; justify-content:space-between;">Súly (kg) <span id="weight-delta" class="delta-badge">--</span></label>
            <input type="number" id="weight" step="0.1" inputmode="decimal" placeholder="0.0" oninput="liveCalc()">
        </div>
        <div class="card">
            <label>Heti változás (H-P)</label>
            <div id="weekly-diff-display" style="font-size:20px; font-weight:800; padding:5px 0;">-- kg</div>
        </div>
    </div>

    <div class="card" id="waist-card" style="display:none;">
        <label>Derékbőség (cm) - Hétfői rögzítés</label>
        <input type="number" id="waist" step="0.1" inputmode="decimal" placeholder="0.0">
    </div>

    <div class="card">
        <label>Lépések</label>
        <div class="btn-grid">
            <input type="number" id="steps_l2" placeholder="Lefekvéskor" inputmode="numeric" oninput="liveCalc()">
            <input type="number" id="steps_l1" placeholder="Most az órán" inputmode="numeric" oninput="liveCalc()">
        </div>
        <div id="step-display" style="text-align:center; font-weight:800; color:var(--success); margin-top:8px; font-size:18px;">0 Lépés</div>
    </div>

    <div class="card">
        <label onclick="showList('kcal')" style="cursor:pointer">Kalória (Bevitt: <span id="kcal-total">0</span>)</label>
        <input type="number" id="kcal_add" placeholder="+ kcal" inputmode="numeric" oninput="liveCalc()">
        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="quick-btn" onclick="quickAdd('kcal_add', 100)">+100</button>
            <button class="quick-btn" onclick="quickAdd('kcal_add', 500)">+500</button>
        </div>
    </div>

    <div class="card">
        <label onclick="showList('water')" style="cursor:pointer">Víz (Összesen: <span id="water-total">0</span> L)</label>
        <input type="number" id="water_add" step="0.1" placeholder="+ Liter" inputmode="decimal">
        <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="quick-btn" style="color:var(--water)" onclick="quickAdd('water_add', 0.3)">+3dl</button>
            <button class="quick-btn" style="color:var(--water)" onclick="quickAdd('water_add', 0.5)">+5dl</button>
        </div>
    </div>

    <div id="daily-def-display">0 kcal</div>
    <div style="text-align:center; font-size:11px; color:var(--gray); margin-top:-5px;">NAPI DEFICIT</div>

    <div class="nav-bar">
        <button id="save-btn" class="main-btn" style="background:var(--success); color:white;" onclick="saveData()">MENTÉS</button>
        <button class="main-btn" style="background:var(--accent); color:white;" onclick="toggleStats(true)">STATISZTIKA</button>
    </div>
</div>

<div id="settings-modal" class="modal">
    <h2 style="text-align:center;">BEÁLLÍTÁSOK</h2>
    <div class="card">
        <label>Születési dátum</label><input type="date" id="set-dob">
        <label style="margin-top:15px;">Magasság (cm)</label><input type="number" id="set-height">
        <label style="margin-top:15px;">Nem</label>
        <select id="set-gender"><option value="male">Férfi</option><option value="female">Nő</option></select>
    </div>
    <button class="main-btn" style="background:var(--success); color:white; margin-top:20px;" onclick="saveSettings()">MENTÉS</button>
    <button class="main-btn" style="background:none; color:white; margin-top:10px;" onclick="toggleSettings(false)">BEZÁRÁS</button>
</div>

<div id="list-modal" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="modal-title" style="margin:0; font-size: 18px;">LISTA</h2>
        <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:30px; cursor:pointer;">✕</button>
    </div>
    <div id="modal-content" class="modal-inner"></div>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    const USER_NAME = "Jani"; 
    let currentDayData = { kcal_list: [], water_list: [] };
    let allHistory = {};
    let userSettings = JSON.parse(localStorage.getItem('user_settings')) || { dob: '1985-11-16', height: 180, gender: 'male' };
    let myChart = null;

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    async function loadDailyData() {
        const dateStr = document.getElementById('date').value;
        try {
            const res = await fetch(`${DB_URL}diet_tracker/${USER_NAME}.json`);
            allHistory = await res.json() || {};
            
            currentDayData = allHistory[dateStr] || { kcal_list: [], water_list: [] };
            if(!currentDayData.kcal_list) currentDayData.kcal_list = [];
            if(!currentDayData.water_list) currentDayData.water_list = [];

            document.getElementById('weight').value = currentDayData.weight || '';
            document.getElementById('waist').value = currentDayData.waist || '';
            document.getElementById('steps_l1').value = currentDayData.steps_l1 || '';
            document.getElementById('steps_l2').value = currentDayData.steps_l2 || '';
            
            updateUI();
            liveCalc();
        } catch(e) { console.error("Hiba a betöltésnél", e); }
    }

    function updateUI() {
        const d = new Date(document.getElementById('date').value);
        document.getElementById('waist-card').style.display = (d.getDay() === 1) ? 'block' : 'none';
        
        const dates = Object.keys(allHistory).sort();
        const dateStr = document.getElementById('date').value;
        const idx = dates.indexOf(dateStr);

        const deltaEl = document.getElementById('weight-delta');
        if (idx > 0 && allHistory[dates[idx-1]].weight && currentDayData.weight) {
            const diff = (currentDayData.weight - allHistory[dates[idx-1]].weight).toFixed(1);
            deltaEl.innerText = (diff > 0 ? "+" : "") + diff;
            deltaEl.style.color = diff > 0 ? "var(--danger)" : "var(--success)";
        } else { deltaEl.innerText = "--"; }

        const mon = new Date(d);
        mon.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
        const monStr = mon.toISOString().split('T')[0];
        const weeklyEl = document.getElementById('weekly-diff-display');
        
        if (allHistory[monStr] && allHistory[monStr].weight && currentDayData.weight) {
            const wDiff = (currentDayData.weight - allHistory[monStr].weight).toFixed(1);
            weeklyEl.innerText = (wDiff > 0 ? "+" : "") + wDiff + " kg";
            weeklyEl.style.color = wDiff > 0 ? "var(--danger)" : "var(--success)";
        } else { weeklyEl.innerText = "-- kg"; weeklyEl.style.color = "var(--text)"; }
        
        refreshTotals();
    }

    function liveCalc() {
        const l1_raw = parseInt(document.getElementById('steps_l1').value) || 0;
        const l2 = parseInt(document.getElementById('steps_l2').value) || 0;
        
        // OKOSÓRA LOGIKA: Mostani kijelzés - lefekvéskori kijelzés
        const actualSteps = Math.max(0, l1_raw - l2);
        document.getElementById('step-display').innerText = `${actualSteps.toLocaleString()} Lépés`;

        const w = parseFloat(document.getElementById('weight').value) || 0;
        if(w > 10) {
            const birth = new Date(userSettings.dob);
            const now = new Date();
            let age = now.getFullYear() - birth.getFullYear();
            const bmr = (10 * w) + (6.25 * userSettings.height) - (5 * age) + (userSettings.gender === 'male' ? 5 : -161);
            const burn = actualSteps * (w * 0.00045);
            const cin = currentDayData.kcal_list.reduce((a,b)=>a+b,0) + (parseInt(document.getElementById('kcal_add').value) || 0);
            const def = Math.round((bmr + burn) - cin);
            const disp = document.getElementById('daily-def-display');
            disp.innerText = `${def} kcal`;
            disp.style.color = def > 0 ? 'var(--success)' : 'var(--danger)';
        }
    }

    async function saveData() {
        const btn = document.getElementById('save-btn');
        const date = document.getElementById('date').value;
        const kA = parseInt(document.getElementById('kcal_add').value) || 0;
        const wA = parseFloat(document.getElementById('water_add').value) || 0;
        
        if(kA > 0) currentDayData.kcal_list.push(kA);
        if(wA > 0) currentDayData.water_list.push(wA);

        const payload = {
            ...currentDayData, 
            weight: parseFloat(document.getElementById('weight').value) || 0,
            waist: parseFloat(document.getElementById('waist').value) || 0,
            steps_l1: parseInt(document.getElementById('steps_l1').value) || 0,
            steps_l2: parseInt(document.getElementById('steps_l2').value) || 0,
            kcal_in: currentDayData.kcal_list.reduce((a,b)=>a+b,0),
            water: parseFloat(currentDayData.water_list.reduce((a,b)=>a+b,0).toFixed(1))
        };

        try {
            await fetch(`${DB_URL}diet_tracker/${USER_NAME}/${date}.json`, { method: 'PATCH', body: JSON.stringify(payload) });
            btn.innerText = "MENTVE! ✓"; btn.style.background = "var(--gray)"; btn.disabled = true;
            setTimeout(() => { btn.innerText = "MENTÉS"; btn.style.background = "var(--success)"; btn.disabled = false; }, 2000);
            document.getElementById('kcal_add').value = '';
            document.getElementById('water_add').value = '';
            loadDailyData();
        } catch(e) { alert("Hiba a mentés során!"); }
    }

    function quickAdd(id, v) { 
        const el = document.getElementById(id); 
        el.value = (parseFloat(el.value || 0) + v).toFixed(id.includes('water') ? 1 : 0); 
        liveCalc(); 
    }

    function refreshTotals() {
        document.getElementById('kcal-total').innerText = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        document.getElementById('water-total').innerText = (currentDayData.water_list.reduce((a,b)=>a+b,0)).toFixed(1);
    }

    function showList(type) {
        const modal = document.getElementById('list-modal');
        const content = document.getElementById('modal-content');
        const title = document.getElementById('modal-title');
        title.innerText = type === 'kcal' ? "KALÓRIA LISTA" : "VÍZ LISTA";
        content.innerHTML = '';
        const list = type === 'kcal' ? currentDayData.kcal_list : currentDayData.water_list;
        list.forEach((val, i) => {
            content.innerHTML += `<div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #222;">
                <span>${val} ${type==='kcal'?'kcal':'L'}</span><span style="color:var(--danger); font-weight:bold" onclick="removeItem('${type}', ${i})">TÖRLÉS</span>
            </div>`;
        });
        modal.style.display = 'flex';
    }

    function removeItem(type, idx) {
        if(type === 'kcal') currentDayData.kcal_list.splice(idx, 1);
        else currentDayData.water_list.splice(idx, 1);
        closeModal(); refreshTotals(); liveCalc();
    }

    function closeModal() { document.getElementById('list-modal').style.display = 'none'; }
    function toggleSettings(s) { 
        if(s) {
            document.getElementById('set-dob').value = userSettings.dob;
            document.getElementById('set-height').value = userSettings.height;
            document.getElementById('set-gender').value = userSettings.gender;
        }
        document.getElementById('settings-modal').style.display = s?'flex':'none'; 
    }

    function saveSettings() {
        userSettings = { 
            dob: document.getElementById('set-dob').value, 
            height: parseInt(document.getElementById('set-height').value), 
            gender: document.getElementById('set-gender').value 
        };
        localStorage.setItem('user_settings', JSON.stringify(userSettings));
        toggleSettings(false); liveCalc();
    }

    function toggleStats(show) {
        const modal = document.getElementById('list-modal');
        const content = document.getElementById('modal-content');
        const title = document.getElementById('modal-title');
        
        if(show) {
            title.innerText = "ELITE ANALYTICS";
            content.innerHTML = `
                <div class="stat-controls">
                    <button class="quick-btn" onclick="renderChart('7')">7 nap</button>
                    <button class="quick-btn" onclick="renderChart('30')">Hónap</button>
                    <button class="quick-btn" onclick="renderChart('all')">Összes</button>
                    <button class="quick-btn" style="background:var(--success)" onclick="exportCSV()">Export</button>
                </div>
                <div class="check-grid">
                    <label><input type="checkbox" id="chk-weight" checked onchange="updateChartVisibility()"> Súly</label>
                    <label><input type="checkbox" id="chk-trend" checked onchange="updateChartVisibility()"> Trend</label>
                    <label><input type="checkbox" id="chk-steps" onchange="updateChartVisibility()"> Lépés</label>
                    <label><input type="checkbox" id="chk-def" onchange="updateChartVisibility()"> Deficit</label>
                    <label><input type="checkbox" id="chk-water" onchange="updateChartVisibility()"> Víz</label>
                    <label><input type="checkbox" id="chk-waist" onchange="updateChartVisibility()"> Derék</label>
                </div>
                <div class="chart-container"><canvas id="weightChart"></canvas></div>
            `;
            modal.style.display = 'flex';
            setTimeout(() => renderChart('7'), 100);
        } else { closeModal(); }
    }

    function renderChart(range) {
        const canvas = document.getElementById('weightChart');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        if(myChart) myChart.destroy();

        let dates = Object.keys(allHistory).sort();
        if(range === '7') dates = dates.slice(-7);
        else if(range === '30') dates = dates.slice(-30);

        const getDeficit = (d) => {
            const day = allHistory[d];
            if(!day.weight) return 0;
            const birth = new Date(userSettings.dob);
            const dDate = new Date(d);
            let age = dDate.getFullYear() - birth.getFullYear();
            const bmr = (10 * day.weight) + (6.25 * userSettings.height) - (5 * age) + (userSettings.gender === 'male' ? 5 : -161);
            const burn = (Math.max(0, (day.steps_l1 || 0) - (day.steps_l2 || 0))) * (day.weight * 0.00045);
            return Math.round((bmr + burn) - (day.kcal_in || 0));
        };

        const weightData = dates.map(d => allHistory[d].weight || null);
        const trendData = weightData.map((v, i, arr) => {
            const slice = arr.slice(Math.max(0, i - 4), i + 1).filter(n => n !== null);
            return slice.length ? (slice.reduce((a, b) => a + b) / slice.length).toFixed(1) : null;
        });

        myChart = new Chart(ctx, {
            data: {
                labels: dates.map(d => d.split('-').slice(1).join('.')),
                datasets: [
                    { label: 'Súly', data: weightData, borderColor: '#0a84ff', backgroundColor: 'rgba(10, 132, 255, 0.1)', yAxisID: 'y', type: 'line', tension: 0.4, fill: true, hidden: !document.getElementById('chk-weight').checked },
                    { label: 'Trend', data: trendData, borderColor: '#ff9500', borderDash: [5, 5], yAxisID: 'y', type: 'line', pointRadius: 0, fill: false, hidden: !document.getElementById('chk-trend').checked },
                    { label: 'Lépés', data: dates.map(d => Math.max(0, (allHistory[d].steps_l1 || 0) - (allHistory[d].steps_l2 || 0))), backgroundColor: '#30d158', yAxisID: 'y1', type: 'bar', hidden: !document.getElementById('chk-steps').checked },
                    { label: 'Deficit', data: dates.map(d => getDeficit(d)), backgroundColor: '#ff453a', yAxisID: 'y1', type: 'bar', hidden: !document.getElementById('chk-def').checked },
                    { label: 'Víz', data: dates.map(d => allHistory[d].water || 0), backgroundColor: '#007aff', yAxisID: 'y1', type: 'bar', hidden: !document.getElementById('chk-water').checked },
                    { label: 'Derék', data: dates.map(d => allHistory[d].waist || null), borderColor: '#bf5af2', yAxisID: 'y', type: 'line', hidden: !document.getElementById('chk-waist').checked }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#8e8e93', font: { size: 10 } } },
                    y: { position: 'left', grid: { color: '#222' }, ticks: { color: '#0a84ff' }, beginAtZero: false },
                    y1: { position: 'right', display: false, beginAtZero: true }
                }
            }
        });
    }

    function updateChartVisibility() {
        if(!myChart) return;
        const ids = ['chk-weight', 'chk-trend', 'chk-steps', 'chk-def', 'chk-water', 'chk-waist'];
        ids.forEach((id, index) => { myChart.setDatasetVisibility(index, document.getElementById(id).checked); });
        myChart.update();
    }

    function exportCSV() {
        let csv = "\uFEFFDatum,Suly(kg),Derek(cm),Ora_Kijelzo,Lefekves_Kijelzo,Kcal_Bevitel,Viz(L)\n";
        Object.keys(allHistory).sort().forEach(d => {
            const day = allHistory[d];
            csv += `${d},${day.weight || ''},${day.waist || ''},${day.steps_l1 || 0},${day.steps_l2 || 0},${day.kcal_in || 0},${day.water || 0}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `elite_tracker_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
    }
    
    window.onfocus = loadDailyData;
    loadDailyData();
</script>
</body>
</html>
