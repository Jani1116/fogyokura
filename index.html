<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Elite Diet Tracker Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #000000; --glass: rgba(28, 28, 30, 0.85);
            --border: rgba(255, 255, 255, 0.12); --accent: #0a84ff;
            --text: #ffffff; --success: #30d158; --gray: #8e8e93; --danger: #ff453a;
            --water: #007aff; --warning: #ff9f0a;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: env(safe-area-inset-top) 15px; }
        .container { max-width: 500px; margin: auto; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 20px; border-radius: 30px; border: 1px solid var(--border); min-height: 92vh; display: flex; flex-direction: column; gap: 12px; }
        @media (orientation: landscape) { .container { max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } .full-width, h1 { grid-column: span 2; } }
        h1 { font-size: 18px; text-align: center; color: var(--accent); letter-spacing: 2px; }
        .input-card { background: rgba(255,255,255,0.06); padding: 15px; border-radius: 20px; border: 1px solid var(--border); }
        label { display: block; font-size: 10px; color: var(--gray); text-transform: uppercase; margin-bottom: 5px; font-weight: 700; }
        input { width: 100%; background: none; border: none; color: white; font-size: 18px; font-weight: 600; outline: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .main-btn { width: 100%; border: none; padding: 16px; border-radius: 18px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-del { width: 40px; background: none; border: none; color: var(--danger); font-size: 18px; }
        #daily-def-display { font-weight: 900; font-size: 30px; text-align: center; }
        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="loading-overlay">FOLYAMATBAN...</div>

<div id="login-screen" class="container" style="justify-content: center;">
    <h1>ELITE DIET TRACKER</h1>
    <div class="input-card"><label>Felhasználó</label><input type="text" id="login-user"></div>
    <div class="input-card"><label>Kód</label><input type="password" id="login-pass"></div>
    <button class="main-btn" style="background: var(--accent); color: white;" onclick="handleLogin()">BELÉPÉS</button>
</div>

<div id="app-content" class="container" style="display:none;">
    <div id="user-display" class="full-width" style="text-align:center; font-size:10px; color:var(--accent);"></div>

    <div class="input-card full-width">
        <label>Dátum</label>
        <input type="date" id="date" onchange="loadDailyData()">
    </div>

    <div class="grid full-width">
        <div class="input-card">
            <label>Ébredési (kg)</label>
            <div style="display:flex;"><input type="number" id="weight" step="0.1" inputmode="decimal" oninput="liveCalc()"><button class="btn-del" onclick="clearField('weight')">✕</button></div>
        </div>
        <div class="input-card">
            <label>Derék (cm)</label>
            <div style="display:flex;"><input type="number" id="waist" step="0.1" inputmode="decimal"><button class="btn-del" onclick="clearField('waist')">✕</button></div>
        </div>
    </div>

    <div class="input-card full-width">
        <label>Lépés (L1: Éjfélig | L2: Éjfél után)</label>
        <div class="grid">
            <input type="number" id="steps_l1" placeholder="L1" inputmode="numeric" oninput="liveCalc()">
            <input type="number" id="steps_l2" placeholder="L2" inputmode="numeric" oninput="liveCalc()">
        </div>
        <div id="step-result" style="text-align:center; margin-top:8px; font-weight:800; color:var(--success);">0 Lépés</div>
    </div>

    <div class="input-card">
        <label>Kalória: <span id="kcal-total">0</span></label>
        <input type="number" id="kcal_add" placeholder="+ kcal" inputmode="numeric" oninput="liveCalc()">
        <div style="display:flex; gap:5px; margin-top:8px;">
            <button class="main-btn" style="background:rgba(255,255,255,0.1); color:white; padding:10px;" onclick="quickAdd('kcal_add', 100)">+100</button>
            <button class="main-btn" style="background:rgba(255,255,255,0.1); color:white; padding:10px;" onclick="quickAdd('kcal_add', 500)">+500</button>
        </div>
    </div>

    <div class="input-card">
        <label>Víz: <span id="water-total">0</span> L</label>
        <input type="number" id="water_add" step="0.1" placeholder="+ Liter" inputmode="decimal">
        <div style="display:flex; gap:5px; margin-top:8px;">
            <button class="main-btn" style="background:var(--water); color:white; padding:10px;" onclick="quickAdd('water_add', 0.3)">+3dl</button>
            <button class="main-btn" style="background:var(--water); color:white; padding:10px;" onclick="quickAdd('water_add', 0.5)">+5dl</button>
        </div>
    </div>

    <div class="input-card full-width">
        <label>Napi jegyzet</label>
        <input type="text" id="daily_note" placeholder="Pl: Éjszakás műszak">
    </div>

    <div id="daily-def-display" class="full-width">0 kcal</div>

    <div class="full-width" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <button id="save-btn" class="main-btn" style="background:var(--success); color:white;" onclick="saveData()">MENTÉS</button>
        <button class="main-btn" style="background:var(--warning); color:black;" onclick="exportCSV()">EXPORT</button>
    </div>
</div>

<script>
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    let currentUser = JSON.parse(localStorage.getItem('diet_session'));
    let currentDayData = { kcal_list: [], water_list: [] };

    document.getElementById('date').valueAsDate = new Date();
    function showLoading(s) { document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none'; }

    async function handleLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}shopping_users/${u}.json`);
            let stored = await res.json();
            if (stored && String(stored).replace(/"/g, '') === String(p)) {
                currentUser = { name: u };
                localStorage.setItem('diet_session', JSON.stringify(currentUser));
                initApp();
            } else alert("Hiba!");
        } catch (e) { alert("Hiba!"); }
        showLoading(false);
    }

    function initApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'flex';
        document.getElementById('user-display').innerText = currentUser.name.toUpperCase();
        loadDailyData();
    }

    async function loadDailyData() {
        const dateStr = document.getElementById('date').value;
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${dateStr}.json`);
            currentDayData = await res.json() || { kcal_list: [], water_list: [] };
            if(!currentDayData.kcal_list) currentDayData.kcal_list = [];
            if(!currentDayData.water_list) currentDayData.water_list = [];
            
            document.getElementById('weight').value = currentDayData.weight || '';
            document.getElementById('waist').value = currentDayData.waist || '';
            document.getElementById('steps_l1').value = currentDayData.steps_l1 || '';
            document.getElementById('steps_l2').value = currentDayData.steps_l2 || '';
            document.getElementById('daily_note').value = currentDayData.note || '';
            
            refreshTotals();
            liveCalc();
        } catch(e) {}
        showLoading(false);
    }

    function refreshTotals() {
        document.getElementById('kcal-total').innerText = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        document.getElementById('water-total').innerText = (currentDayData.water_list.reduce((a,b)=>a+b,0)).toFixed(1);
    }

    function liveCalc() {
        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const s1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const s2 = parseInt(document.getElementById('steps_l2').value) || 0;
        const steps = s1 + s2;
        document.getElementById('step-result').innerText = `${steps.toLocaleString()} Lépés`;

        if(weight > 0) {
            const bmr = (10 * weight) + (6.25 * 170) - (5 * 41) + 5; // 1985 szül.
            const burn = steps * (weight * 0.00045);
            const cin = currentDayData.kcal_list.reduce((a,b)=>a+b,0) + (parseInt(document.getElementById('kcal_add').value) || 0);
            const def = Math.round((bmr + burn) - cin);
            const disp = document.getElementById('daily-def-display');
            disp.innerText = `${def} kcal`;
            disp.style.color = def > 0 ? 'var(--success)' : 'var(--danger)';
        }
    }

    function quickAdd(id, val) {
        const el = document.getElementById(id);
        el.value = (parseFloat(el.value || 0) + val).toFixed(id === 'water_add' ? 1 : 0);
        liveCalc();
    }

    function clearField(id) { document.getElementById(id).value = ''; liveCalc(); }

    async function saveData() {
        const btn = document.getElementById('save-btn');
        btn.disabled = true;
        showLoading(true);
        
        const date = document.getElementById('date').value;
        const kA = parseInt(document.getElementById('kcal_add').value) || 0;
        const wA = parseFloat(document.getElementById('water_add').value) || 0;
        
        if(kA > 0) currentDayData.kcal_list.push(kA);
        if(wA > 0) currentDayData.water_list.push(wA);

        const w = parseFloat(document.getElementById('weight').value) || 0;
        const l1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const l2 = parseInt(document.getElementById('steps_l2').value) || 0;
        const cin = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        const bmr = (10 * w) + (6.25 * 170) - (5 * 41) + 5;
        const def = Math.round((bmr + ((l1+l2) * w * 0.00045)) - cin);

        const payload = {
            ...currentDayData, date, weight: w,
            waist: parseFloat(document.getElementById('waist').value) || 0,
            steps_l1: l1, steps_l2: l2, steps: l1+l2,
            kcal_in: cin, deficit: def, note: document.getElementById('daily_note').value,
            water: parseFloat(currentDayData.water_list.reduce((a,b)=>a+b,0).toFixed(1))
        };

        try {
            await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${date}.json`, { method: 'PATCH', body: JSON.stringify(payload) });
            document.getElementById('kcal_add').value = '';
            document.getElementById('water_add').value = '';
            await loadDailyData();
        } catch(e) { alert("Hiba!"); }
        
        btn.disabled = false;
        showLoading(false);
    }

    async function exportCSV() {
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}.json`);
            const data = await res.json();
            let csv = "Datum;Suly;Derek;Lepes;Kcal_Be;Deficit;Viz;Jegyzet\n";
            for (let d in data) {
                const o = data[d];
                csv += `${d};${o.weight||0};${o.waist||0};${o.steps||0};${o.kcal_in||0};${o.deficit||0};${o.water||0};${o.note||""}\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `diet_export.csv`;
            a.click();
        } catch(e) { alert("Hiba!"); }
        showLoading(false);
    }

    if(currentUser) initApp();
</script>
</body>
</html>
