<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Fogyókúra Elite Pro Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #000000; --glass: rgba(28, 28, 30, 0.9);
            --border: rgba(255, 255, 255, 0.1); --accent: #0a84ff;
            --text: #ffffff; --success: #30d158; --gray: #8e8e93; --danger: #ff453a;
            --water: #007aff; --trend: #ff9f0a; --warning: #ffd60a;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 500px; margin: auto; background: var(--glass); backdrop-filter: blur(15px); padding: 15px; border-radius: 25px; border: 1px solid var(--border); min-height: 95vh; display: flex; flex-direction: column; }
        
        h1 { font-size: 20px; text-align: center; margin: 10px 0; color: var(--accent); letter-spacing: 1.5px; font-weight: 900; }
        .input-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 18px; margin-bottom: 10px; border: 1px solid var(--border); }
        label { display: block; font-size: 10px; color: var(--gray); text-transform: uppercase; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; background: none; border: none; color: white; font-size: 18px; font-weight: 600; outline: none; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .main-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 15px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .main-btn:active { opacity: 0.7; }
        
        .del-x { background: none; border: none; color: var(--danger); font-size: 20px; font-weight: bold; cursor: pointer; padding: 0 10px; }
        
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; padding: 15px; overflow-y: auto; }
        #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; align-items: center; justify-content: center; color: var(--accent); font-weight: bold; }
        
        .list-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; padding: 30px 20px; }
        .list-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--border); align-items: center; }
    </style>
</head>
<body>

<div id="loading-overlay">ADATOK...</div>

<div id="login-screen" class="container" style="justify-content: center;">
    <h1>FOGYÓKÚRA ELITE</h1>
    <div class="input-card"><label>Felhasználónév</label><input type="text" id="login-user" spellcheck="false"></div>
    <div class="input-card"><label>Jelszó</label><input type="password" id="login-pass"></div>
    <button class="main-btn" onclick="handleLogin()">BELÉPÉS</button>
</div>

<div id="app-content" class="container" style="display:none;">
    <div id="user-display" style="font-size: 9px; color: var(--accent); text-align: center; letter-spacing: 3px; margin-bottom: 5px; font-weight: bold;"></div>
    
    <div class="input-card">
        <label>Dátum</label>
        <input type="date" id="date" onchange="loadDailyData()">
    </div>
    
    <div class="grid">
        <div class="input-card">
            <label>Ébredési (kg)</label>
            <div style="display:flex;"><input type="number" id="weight" step="0.1" inputmode="decimal" oninput="liveCalc()"><button class="del-x" onclick="clearField('weight')">✕</button></div>
        </div>
        <div class="input-card">
            <label>Lefekvési (kg)</label>
            <div style="display:flex;"><input type="number" id="weight_evening" step="0.1" inputmode="decimal"><button class="del-x" onclick="clearField('weight_evening')">✕</button></div>
        </div>
    </div>

    <div class="input-card">
        <label>Lépések (L1: Éjfélig | L2: Éjfél után)</label>
        <div class="grid">
            <input type="number" id="steps_l1" placeholder="L1" inputmode="numeric" oninput="liveCalc()">
            <input type="number" id="steps_l2" placeholder="L2" inputmode="numeric" oninput="liveCalc()">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
            <div id="step-result" style="font-weight: 800; color: var(--success);">0 Lépés</div>
            <button onclick="clearSteps()" style="background:none; border:none; color:var(--danger); font-size:11px; font-weight:bold;">TÖRLÉS</button>
        </div>
    </div>

    <div class="input-card">
        <label onclick="showEditList('kcal')" style="cursor:pointer">Bevitel: <span id="kcal-total">0</span> kcal 🔍</label>
        <input type="number" id="kcal_add" placeholder="+ Hozzáad" inputmode="numeric" oninput="liveCalc()">
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <button class="main-btn" style="background:rgba(255,255,255,0.1);" onclick="quickAdd('kcal_add', 100)">+100</button>
            <button class="main-btn" style="background:rgba(255,255,255,0.1);" onclick="quickAdd('kcal_add', 500)">+500</button>
            <button class="main-btn" style="width:50px; background:var(--danger);" onclick="clearField('kcal_add')">✕</button>
        </div>
    </div>

    <div class="input-card">
        <label onclick="showEditList('water')" style="cursor:pointer">Víz: <span id="water-total">0</span> L 🔍</label>
        <input type="number" id="water_add" step="0.1" placeholder="+ Hozzáad" inputmode="decimal">
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <button class="main-btn" style="background:var(--water);" onclick="quickAdd('water_add', 0.3)">+3dl</button>
            <button class="main-btn" style="background:var(--water);" onclick="quickAdd('water_add', 0.5)">+5dl</button>
            <button class="main-btn" style="width:50px; background:var(--danger);" onclick="clearField('water_add')">✕</button>
        </div>
    </div>

    <div class="input-card" style="text-align: center; background: rgba(48, 209, 88, 0.05);">
        <label>Napi Deficit</label>
        <div id="daily-def-display" style="font-weight: 900; font-size: 26px; color: var(--success);">0 kcal</div>
    </div>

    <button class="main-btn" onclick="saveData()" style="background:var(--success); margin-bottom:10px;">MENTÉS</button>
    <button class="main-btn" onclick="openCharts()" style="background:rgba(255,255,255,0.08);">STATISZTIKA</button>
    <button onclick="logout()" style="background:none; border:none; color:var(--gray); width:100%; font-size:10px; margin-top:20px;">KIJELENTKEZÉS</button>
</div>

<div id="list-overlay" class="list-overlay">
    <h2 id="list-title" style="color:var(--accent)"></h2>
    <div id="list-content"></div>
    <button class="main-btn" onclick="closeList()" style="margin-top:20px;">BEZÁRÁS</button>
</div>

<div id="chart-modal" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Statisztika</h2>
        <button onclick="closeChart()" style="background:none; border:none; color:white; font-size:30px;">✕</button>
    </div>
    <canvas id="mainChart" style="max-height: 300px;"></canvas>
    <div id="summary-box" style="margin-top:20px; padding:15px; background:rgba(10,132,255,0.1); border-radius:15px;"></div>
</div>

<script>
    const DB_URL = "https://kiadaskoveto-2e474-default-rtdb.firebaseio.com/";
    let currentUser = JSON.parse(localStorage.getItem('diet_session'));
    let currentDayData = { kcal_list: [], water_list: [] };
    let myChart = null;

    document.getElementById('date').valueAsDate = new Date();

    function showLoading(s) { document.getElementById('loading-overlay').style.display = s ? 'flex' : 'none'; }

    async function handleLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        if(!u || !p) return;
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}shopping_users/${u}.json`);
            let stored = await res.json();
            if (stored && String(stored).replace(/"/g, '') === String(p)) {
                currentUser = { name: u };
                localStorage.setItem('diet_session', JSON.stringify(currentUser));
                initApp();
            } else alert("Hiba!");
        } catch (e) { alert("Hiba!"); }
        showLoading(false);
    }

    function initApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'flex';
        document.getElementById('user-display').innerText = currentUser.name.toUpperCase();
        loadDailyData();
    }

    async function loadDailyData() {
        const dateStr = document.getElementById('date').value;
        showLoading(true);
        try {
            const res = await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${dateStr}.json`);
            currentDayData = await res.json() || { kcal_list: [], water_list: [] };
            if(!currentDayData.kcal_list) currentDayData.kcal_list = [];
            if(!currentDayData.water_list) currentDayData.water_list = [];

            document.getElementById('weight').value = currentDayData.weight || '';
            document.getElementById('weight_evening').value = currentDayData.weight_evening || '';
            document.getElementById('steps_l1').value = currentDayData.steps_l1 || '';
            document.getElementById('steps_l2').value = currentDayData.steps_l2 || '';
            
            refreshTotals();
            liveCalc();
        } catch(e) {}
        showLoading(false);
    }

    function refreshTotals() {
        document.getElementById('kcal-total').innerText = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        document.getElementById('water-total').innerText = currentDayData.water_list.reduce((a,b)=>a+b,0).toFixed(1);
    }

    function liveCalc() {
        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const l1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const l2 = parseInt(document.getElementById('steps_l2').value) || 0;
        const totalSteps = l1 + l2;
        document.getElementById('step-result').innerText = `${totalSteps.toLocaleString()} Lépés`;

        if(weight > 0) {
            const age = new Date().getFullYear() - 1985;
            const bmr = (10 * weight) + (6.25 * 170) - (5 * age) + 5;
            const burn = totalSteps * (weight * 0.00045);
            const cin = currentDayData.kcal_list.reduce((a,b)=>a+b,0) + (parseInt(document.getElementById('kcal_add').value) || 0);
            const def = Math.round((bmr + burn) - cin);
            const disp = document.getElementById('daily-def-display');
            disp.innerText = `${def} kcal`;
            disp.style.color = def > 0 ? 'var(--success)' : 'var(--danger)';
        }
    }

    function quickAdd(id, val) {
        const el = document.getElementById(id);
        el.value = (parseFloat(el.value || 0) + val).toFixed(id === 'water_add' ? 1 : 0);
        liveCalc();
    }

    function clearField(id) { document.getElementById(id).value = ''; liveCalc(); }
    function clearSteps() { document.getElementById('steps_l1').value = ''; document.getElementById('steps_l2').value = ''; liveCalc(); }

    async function saveData() {
        showLoading(true);
        const date = document.getElementById('date').value;
        const kAdd = parseInt(document.getElementById('kcal_add').value) || 0;
        const wAdd = parseFloat(document.getElementById('water_add').value) || 0;
        if(kAdd > 0) currentDayData.kcal_list.push(kAdd);
        if(wAdd > 0) currentDayData.water_list.push(wAdd);

        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const l1 = parseInt(document.getElementById('steps_l1').value) || 0;
        const l2 = parseInt(document.getElementById('steps_l2').value) || 0;
        const totalSteps = l1 + l2;
        const cin = currentDayData.kcal_list.reduce((a,b)=>a+b,0);
        const bmr = (10 * weight) + (6.25 * 170) - (5 * (new Date().getFullYear()-1985)) + 5;
        const def = Math.round((bmr + (totalSteps * weight * 0.00045)) - cin);

        const up = { ...currentDayData, date, weight, weight_evening: parseFloat(document.getElementById('weight_evening').value)||0, steps_l1: l1, steps_l2: l2, steps: totalSteps, kcal_in: cin, deficit: def, water: parseFloat(currentDayData.water_list.reduce((a,b)=>a+b,0).toFixed(1)) };
        await fetch(`${DB_URL}diet_tracker/${currentUser.name}/${date}.json`, { method: 'PATCH', body: JSON.stringify(up) });
        document.getElementById('kcal_add').value = ''; document.getElementById('water_add').value = '';
        await loadDailyData();
        showLoading(false);
    }

    function showEditList(type) {
        const list = type === 'kcal' ? currentDayData.kcal_list : currentDayData.water_list;
        document.getElementById('list-title').innerText = type === 'kcal' ? 'Kalória' : 'Víz';
        document.getElementById('list-content').innerHTML = list.map((v,i) => `<div class="list-item"><span>${v}</span><button onclick="removeItem('${type}',${i})" style="color:var(--danger); background:none; border:none;">TÖRLÉS</button></div>`).join('');
        document.getElementById('list-overlay').style.display = 'block';
    }

    async function removeItem(type, i) {
        if(type==='kcal') currentDayData.kcal_list.splice(i,1); else currentDayData.water_list.splice(i,1);
        await saveData(); showEditList(type);
    }
    function closeList() { document.getElementById('list-overlay').style.display = 'none'; }
    function logout() { localStorage.removeItem('diet_session'); location.reload(); }
    if(currentUser) initApp();
</script>
</body>
</html>
